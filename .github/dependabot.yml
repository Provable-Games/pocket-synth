version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Terser and Playwright are left out of the group, so each gets a pull
      # request of its own. A new Terser can change the minified bytes, which CI
      # rejects until the distribution is rebuilt and its new SHA-256 is
      # recorded. A new Playwright changes the pinned browser bundles, which the
      # full-mix reference check in npm run test:node rejects until the
      # reference is recaptured (README, "Recapturing the full-mix reference").
      development-dependencies:
        dependency-type: development
        patterns: ["*"]
        exclude-patterns: ["terser", "playwright-core"]

  # The Codex CLI pin used by the AI-review workflows, a separate package.
  - package-ecosystem: npm
    directory: /.github/scripts/codex-cli
    schedule:
      interval: monthly
    groups:
      codex-cli:
        patterns: ["*"]
